# Label reference for this repo (manual setup — no label-sync Action).
# Create missing labels via Settings > Labels or `gh label create`.
# Colors are hex without leading `#`.

# Entry trigger
- name: ai-triage
  color: "0E8A16"
  description: "Opt-in to issue triage"

# Classification labels
- name: "kind/technical"
  color: "1D76DB"
  description: "Requires technical work (code, implementation)"
- name: "kind/non-technical"
  color: "FBCA04"
  description: "Non-technical (admin, docs, research)"

# Tech-lead workflow labels
- name: "tl/ready"
  color: "0E8A16"
  description: "Tech-lead should pick up"
- name: "tl/building"
  color: "1D76DB"
  description: "Tech-lead/programmer working"
- name: "tl/done"
  color: "0E8A16"
  description: "Work complete (terminal)"

# Status labels
- name: "status:done"
  color: "0E8A16"
  description: "Issue complete"
- name: "status:in-progress"
  color: "FBCA04"
  description: "Work in progress"

# Legacy labels (kept for backward compatibility)
- name: "type: feature"
  color: "1D76DB"
