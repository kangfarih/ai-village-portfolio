name: agent-build

# Empty default: jobs declare their own permissions below.
permissions: {}

# TL + programmer trial (PLAN 01: /approve -> session branch -> PR -> dev).
# Fires when a maintainer comments `/approve` on an OPEN issue (not a PR).
# LLM: multi-provider chain via .github/scripts/llm_json.sh
# (openrouter -> gemini -> groq -> cline -> ollama).
# The `model` input below is an informational label only; LLM calls go through
# the chain (see also Go console "Use balance" toggle in trial NOTES).
# Workflow-level fallback: if the primary-model limit is hit, a maintainer
# re-runs via `workflow_dispatch` overriding `model` with the next model in
# the chain (see also Go console "Use balance" toggle in trial NOTES).
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    # NOTE: workflow_dispatch requires write access to run (maintainer fallback
    # re-run path); keep as-is — human-gated by GitHub permissions, not by the
    # `if:` gate below (which only gates the issue_comment trigger).
    inputs:
      issue_number:
        description: "Issue number to build (fallback re-run)"
        required: true
      model:
        description: "Informational model label (LLM calls use the llm_json.sh provider chain)"
        default: "llm-chain (llm_json.sh)"
        required: false

jobs:
  build:
    # Human gate: `/approve` from OWNER/MEMBER/COLLABORATOR on an open plain issue.
    # `${{ !github.event.issue.pull_request }}` skips PR comments; the
    # workflow_dispatch branch is for maintainer fallback re-runs.
    # W1: startsWith (not contains) so `/approve` must lead the comment —
    # GitHub expressions have no trim()/regex, so leading-whitespace variants
    # will not trigger (post `/approve` at the start of the line).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.state == 'open' &&
        !github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/approve') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        github.event.comment.author.type != 'Bot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: agent-build-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # Set agent identity for all commits made by this workflow.
      # Commits will show "github-workflow-agent" as author, but push still uses GITHUB_TOKEN.
      - name: Configure git author identity
        run: |
          git config user.name "github-workflow-agent"
          git config user.email "agent@users.noreply.github.com"

      # fetch-depth 0 + persist-credentials true: the agent must push the
      # session/* branch back, so a full clone with a pushing credential is
      # required (trial simplicity over a separate PAT step).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - run: git config user.name "github-workflow-agent" && git config user.email "agent@users.noreply.github.com"
        name: Set agent git identity

      # Agent is now pure GitHub workflow agent; LLM via .github/scripts/llm_json.sh provider chain.
      # No external action; native bash/comment steps only.
      - name: Document pure GitHub workflow agent
        run: |
          echo "Agent: pure GitHub workflow agent"
          echo "LLM: multi-provider chain via llm_json.sh (openrouter -> gemini -> groq -> cline -> ollama)"

      # Native bash step: approve/build (read-only on product code, pushes session/* branch).
      - name: Build session branch (native bash)
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          MODEL: ${{ inputs.model || 'llm-chain (llm_json.sh)' }}
        run: |
          echo "/approve for issue #${ISSUE_NUMBER}"
          echo "LLM: ${MODEL}"
          echo "Cut branch session/* from fresh origin/dev; open PR to dev; never merge."
