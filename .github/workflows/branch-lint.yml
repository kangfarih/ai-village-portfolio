name: branch-lint

# Empty default: jobs declare their own least-privilege permissions below.
permissions: {}

# Enforce session-branch convention + dev base. No gh auth required.
on:
  pull_request:
    branches: [dev]

concurrency:
  group: branch-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check head/base naming
        run: |
          HEAD="${{ github.head_ref }}"
          BASE="${{ github.base_ref }}"
          echo "head=$HEAD base=$BASE"
          if [ "$BASE" != "dev" ]; then
            echo "::error::Base must be 'dev' (got '$BASE')."
            exit 1
          fi
          # Accept either the human session convention or the agent integration
          # convention:
          #   session/<T-XXX|B-XXX>-<slug>-YYYYMMDD-<init>
          #     e.g. session/T-010-hero-20260910-ab
          #   issue/<parent#>   e.g. issue/55   (agent integration PR head)
          #   task/<goal#>      e.g. task/55    (per-goal branch; accepted for
          #                                     completeness, not a PR head)
          if ! echo "$HEAD" | grep -Eq '^(session/(T|B)-[0-9]+-[a-z0-9-]+-[0-9]{8}-[a-z]+|(issue|task)/[0-9]+)$'; then
            echo "::error::Head '$HEAD' must match either 'session/(T-|B-)<id>-<slug>-YYYYMMDD-<init>' (e.g. session/T-010-hero-20260910-ab) or 'issue/<n>' / 'task/<n>' (e.g. issue/55)."
            exit 1
          fi
          echo "OK: branch naming valid."
