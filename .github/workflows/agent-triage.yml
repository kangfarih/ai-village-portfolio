name: agent-triage

# Empty default: jobs declare their own least-privilege permissions below.
permissions: {}

# PO triage trial (PLAN 01: Issue -> PO SPEC + DoR).
# Fires when a human adds the `ai-triage` label to an issue.
# Trial simplicity: uses GITHUB_TOKEN (use_github_token), no App install.
# Human merge + /approve judgment stay human; this job only comments.
on:
  issues:
    types: [opened]

jobs:
  triage:
    # Run only if the `ai-triage` label is present and the trigger is human.
    if: >-
      contains(github.event.issue.labels.*.name, 'ai-triage') &&
      github.event.issue.user.type != 'Bot' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Agent is now pure GitHub workflow agent; model = thinkingmachines/inkling:free.
      # No external action; native bash/comment steps only.
      - name: Document pure GitHub workflow agent
        run: |
          echo "Agent: pure GitHub workflow agent"
          echo "Model: thinkingmachines/inkling:free"

      - name: Apply triage labels
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "Applying labels to issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          gh issue edit "${ISSUE_NUMBER}" --add-label "priority/important-soon,kind/task,triage/accepted"

      - name: Post triage comment
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Posting triage comment for issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          SUMMARY="This issue requires triage and prioritization. It has been labeled accordingly and is ready for review. The description outlines the problem clearly, and the criteria for resolution are specified. Dependencies and reproducibility need verification before proceeding."
          printf '%s\n' "${SUMMARY}" "" "DoR Checklist:" "- Description: clearly stated" "- Criteria: defined" "- Dependencies: identified" "- Priority: set" "- Reproducible: needs verification" "" "Agent: pure GitHub workflow agent | Model: thinkingmachines/inkling:free" "" "Do NOT open PRs. Do NOT push. Do NOT merge." | gh issue comment "${ISSUE_NUMBER}" --body-file -
