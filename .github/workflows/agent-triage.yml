name: agent-triage

# Empty default: jobs declare their own least-privilege permissions below.
permissions: {}

# PO triage trial (PLAN 01: Issue -> PO SPEC + DoR).
# Fires when a human adds the `ai-triage` label to an issue.
# Trial simplicity: uses GITHUB_TOKEN (use_github_token), no App install.
# Human merge + /approve judgment stay human; this job only comments.
on:
  issues:
    types: [opened, labeled]

jobs:
  triage:
    # Run only if the `ai-triage` label is present and the trigger is human.
    if: >-
      contains(github.event.issue.labels.*.name, 'ai-triage') &&
      github.event.issue.user.type != 'Bot' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Agent is now pure GitHub workflow agent; model = thinkingmachines/inkling:free.
      # No external action; native bash/comment steps only.
      - name: Document pure GitHub workflow agent
        run: |
          echo "Agent: pure GitHub workflow agent"
          echo "Model: thinkingmachines/inkling:free"

      # Native bash step: post triage comment (read-only, no PR/push/merge).
      - name: Triage comment (native bash)
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "/triage for issue #${ISSUE_NUMBER} (${ISSUE_TITLE})"
          echo "Summarize in 3-5 sentences; propose DoR checklist."
          echo "Post exactly ONE comment. Do NOT open PRs. Do NOT push. Do NOT merge."
