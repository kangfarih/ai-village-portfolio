<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio - Tiny RPG PixiJS Prototype</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: 'Courier New', Courier, monospace;
        color: #fff;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        display: block;
        box-shadow: 0 0 20px rgba(0,0,0,0.8);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
